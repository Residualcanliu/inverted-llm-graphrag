[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huigong-graphrag"
version = "0.1.0"
description = "Inverted-LLM GraphRAG — 大模型只生成查询语句，由图引擎确定性执行"
requires-python = ">=3.10"
# 依赖清单在 requirements.txt，这里不重复声明，避免两处不同步
dependencies = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 pytest 直接以项目根为工作目录，无需 py.path 或 conftest 补路径
pythonpath = ["."]
