services:
  neo4j:
    image: neo4j:5.26-community
    container_name: inverted-llm-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      # 密码从 .env 读，保持单一来源。
      # 注意：这个变量只在数据库**首次初始化**时生效。库建好之后再改它没有任何效果，
      # 改密码要用 scripts/set_password.py。见该脚本文件头的说明。
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-please_change_me}
      # APOC：本项目的 schema 读取用 Cypher 内置过程就够了，
      # 但 PageRank 那类图算法需要 GDS；APOC 先装上备用
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      # 数据规模很小（150-250 节点），内存给够即可
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
